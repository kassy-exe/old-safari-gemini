<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Claudeとおしゃべり</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{height:100%;margin:0}
body{background:#f6f5f2;color:#1f1f1f;font-family:-apple-system,"Hiragino Sans",sans-serif;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#top{display:-webkit-flex;display:flex;padding:6px 8px;border-bottom:1px solid #ddd;font-size:13px;-webkit-align-items:center;align-items:center}
#top select{font-size:14px;margin-left:6px}
#log{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.m{max-width:85%;margin:6px 0;padding:9px 12px;border-radius:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;font-size:15px;font-family:Menlo,"Osaka-Mono",monospace}
.u{background:#2f6fed;color:#fff;margin-left:auto}
.a{background:#fff;border:1px solid #ddd}
.s{color:#777;font-size:12px;text-align:center;margin:8px 0}
#bar{display:-webkit-flex;display:flex;padding:8px;border-top:1px solid #ddd}
#in{-webkit-flex:1;flex:1;font-size:16px;padding:8px 10px;border:1px solid #ddd;border-radius:10px;resize:none;height:42px;font-family:inherit}
button{font-size:15px;margin-left:8px;padding:0 14px;border:0;border-radius:10px;background:#2f6fed;color:#fff}
button.g{background:#ccc;color:#222}
button[disabled]{opacity:.5}
</style>
</head>
<body>
<div id="top">
<span>モデル</span>
<select id="model">
<option value="gemini-flash-latest">Flash (latest)</option>
<option value="gemini-flash-lite-latest">Flash-Lite (latest)</option>
</select>
</div>
<div id="log"><div class="s">ここに喋りかけて</div></div>
<div id="bar">
<textarea id="in" placeholder="メッセージ"></textarea>
<button id="send">送信</button>
<button id="clr" class="g">消す</button>
</div>
<script>
(function(){
var SYSTEM = "以下の口調ルールを必ず守って返答して。\n"
+ "【口調】タメ口、友達ノリ、ツッコミ寄り。ネットミーム・ぬっこ系のノリには全力で乗る。絵文字なし、句点は控えめ、改行で読みやすく。日本語には日本語、英語には英語で返す。\n"
+ "【長さ】相手の文章量に合わせる、雑談は簡潔に。\n"
+ "【姿勢】お世辞なし、ストレートに。できない事は理由と代案を示す。\n"
+ "【語彙】見慣れない単語や仏教語由来も使って語彙は高め、漢字は時々捻る。簡単じゃない説明の時は図を用いる。\n"
+ "【図の出し方】図は ```svg と ``` で囲んだ完全なSVG(xmlns付き、viewBox付き、幅は600前後)で出す。先頭に白い背景のrectを置き、文字は濃い色、フォントはsans-serif。scriptや外部リンクは禁止。簡単な話にはSVGは使わない。\n";
var log = document.getElementById("log");
var inp = document.getElementById("in");
var btn = document.getElementById("send");
var clr = document.getElementById("clr");
var modelSel = document.getElementById("model");
var hist = [];
var busy = false;
var apiKey = "ここにGeminiのAPIキーを貼る";

function scroll(){ log.scrollTop = log.scrollHeight; }
function add(cls, text){
  var d = document.createElement("div");
  d.className = "m " + cls;
  d.textContent = text;
  log.appendChild(d); scroll();
  return d;
}
function note(text){
  var d = document.createElement("div");
  d.className = "s";
  d.textContent = text;
  log.appendChild(d); scroll();
}
function render(el, text){
  el.textContent = "";
  var re = /```svg\s*([\s\S]*?)```/g;
  var last = 0, m;
  function addText(s){
    s = s.replace(/^\s+|\s+$/g, "");
    if (s) { var n = document.createElement("div"); n.textContent = s; el.appendChild(n); }
  }
  while ((m = re.exec(text)) !== null) {
    addText(text.slice(last, m.index));
    var img = document.createElement("img");
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(m[1]);
    img.style.cssText = "max-width:100%;height:auto;display:block;margin:8px 0;border-radius:8px;background:#fff";
    el.appendChild(img);
    last = re.lastIndex;
  }
  addText(text.slice(last));
  if (!el.firstChild) { el.textContent = text; }
}
function send(){
  var t = inp.value.replace(/^\s+|\s+$/g, "");
  if (!t || busy) { return; }
  if (apiKey.indexOf("AIza") !== 0) { note("HTML内のapiKeyにキーを貼ってから使って"); return; }
  busy = true; btn.disabled = true;
  inp.value = "";
  add("u", t);
  hist.push({ role: "user", content: t });
  var bubble = add("a", "…");
  var x = new XMLHttpRequest();
  x.open("POST", "https://generativelanguage.googleapis.com/v1beta/models/" + modelSel.value + ":generateContent?key=" + encodeURIComponent(apiKey), true);
  x.setRequestHeader("Content-Type", "application/json");
  x.timeout = 120000;
  function done(){ busy = false; btn.disabled = false; scroll(); }
  function fail(msg){ bubble.textContent = msg; hist.pop(); done(); }
  x.onload = function(){
    var d;
    try { d = JSON.parse(x.responseText); } catch (e) { return fail("返答が読めん: " + x.status); }
    if (x.status !== 200) {
      return fail("失敗(" + x.status + "): " + ((d && d.error && d.error.message) || ""));
    }
    var out = "";
    var c = d.candidates && d.candidates[0];
    var parts = (c && c.content && c.content.parts) || [];
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].text) { out += parts[i].text; }
    }
    if (!out) { return fail("空の返答(安全フィルタかも)"); }
    render(bubble, out);
    hist.push({ role: "model", content: out });
    done();
  };
  x.onerror = function(){ fail("通信エラー(キーかネットか確認)"); };
  x.ontimeout = function(){ fail("タイムアウト"); };
  var contents = [];
  for (var j = 0; j < hist.length; j++) {
    contents.push({ role: hist[j].role, parts: [{ text: hist[j].content }] });
  }
  x.send(JSON.stringify({
    system_instruction: { parts: [{ text: SYSTEM }] },
    contents: contents
  }));
}

btn.addEventListener("click", send);
clr.addEventListener("click", function(){ hist = []; log.innerHTML = ""; note("リセットした"); });
})();
</script>
</body>
</html>
